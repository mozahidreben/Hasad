<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#007478">
<title>REBEN Petroleum</title>
<style>
:root{--gold:#996515;--gold-hi:#c58a2c;--teal:#007478;--teal-dark:#004d50}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--teal-dark);-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Tahoma,Arial,sans-serif;color:#fff;
background:
 radial-gradient(420px 320px at 50% -40px,rgba(0,190,196,.45),transparent 70%),
 linear-gradient(180deg,var(--teal) 0%,var(--teal-dark) 100%);
background-attachment:scroll;
display:flex;justify-content:center;
padding:max(40px,env(safe-area-inset-top)) 18px max(28px,env(safe-area-inset-bottom))}
main{width:100%;max-width:440px;text-align:center}

/* logo */
.logo{width:124px;height:124px;border-radius:50%;background:#fff;border:4px solid var(--gold);
object-fit:contain;padding:10px;display:block;margin:0 auto 20px;
box-shadow:0 0 0 7px rgba(197,138,44,.2),0 12px 30px rgba(0,0,0,.35)}
h1{font-size:1.65rem;font-weight:700;letter-spacing:.5px;line-height:1.2}
.sub{margin:8px 0 22px;font-size:1.05rem;color:rgba(255,255,255,.88)}

/* big call button */
.call{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;
background:linear-gradient(135deg,var(--gold-hi),var(--gold));color:#fff;text-decoration:none;
font-weight:700;font-size:1.4rem;letter-spacing:1px;padding:0 44px;border-radius:40px;
border:2px solid #fff;margin-bottom:28px;box-shadow:0 10px 24px rgba(0,0,0,.3);
transition:transform .18s ease,box-shadow .18s ease}
.call svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* contact cards */
.list{display:flex;flex-direction:column;gap:14px}
.item{display:flex;align-items:center;gap:16px;min-height:76px;background:#fff;color:var(--teal);text-decoration:none;
border-radius:14px;padding:12px 16px 12px 14px;border-left:6px solid var(--gold);text-align:left;
box-shadow:0 6px 16px rgba(0,0,0,.22);transition:transform .18s ease,box-shadow .18s ease}
.ic{flex:none;width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,var(--gold-hi),var(--gold));
display:grid;place-items:center;box-shadow:0 4px 10px rgba(153,101,21,.4)}
.ic svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wa .ic{background:linear-gradient(135deg,#34d070,#12924d);box-shadow:0 4px 10px rgba(18,146,77,.4)}
.t{flex:1;min-width:0}
.t b{display:block;font-size:1.08rem;font-weight:700}
.t small{display:block;margin-top:2px;color:var(--gold);font-size:.92rem;font-weight:600;overflow-wrap:anywhere}
.go{flex:none;width:18px;height:18px;stroke:#9db7b8;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:transform .18s ease,stroke .18s}

/* touch feedback (instant on phones) */
.item:active,.call:active{transform:scale(.97)}
.item:active{box-shadow:0 2px 8px rgba(0,0,0,.25)}
@media (hover:hover){
 .item:hover{transform:translateY(-3px);box-shadow:0 12px 24px rgba(0,0,0,.3)}
 .item:hover .go{transform:translateX(4px);stroke:var(--gold)}
 .call:hover{transform:scale(1.04)}
}
.item:focus-visible,.call:focus-visible{outline:3px solid #f0cf86;outline-offset:2px}

footer{margin-top:28px;font-size:.82rem;color:rgba(255,255,255,.65)}

/* one smooth entrance (transform + opacity only) */
.logo,h1,.sub,.call,.item,footer{opacity:0;transform:translateY(14px);animation:in .55s cubic-bezier(.2,.8,.2,1) forwards}
h1{animation-delay:.05s}.sub{animation-delay:.1s}.call{animation-delay:.15s}
.item:nth-child(1){animation-delay:.22s}.item:nth-child(2){animation-delay:.3s}
.item:nth-child(3){animation-delay:.38s}.item:nth-child(4){animation-delay:.46s}footer{animation-delay:.55s}
@keyframes in{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}
 .logo,h1,.sub,.call,.item,footer{opacity:1;transform:none}}
@media (max-width:360px){h1{font-size:1.45rem}.call{font-size:1.25rem;padding:0 32px}}
</style>
</head>
<body>

  <img class="logo" src="logo.png" alt="REBEN logo" onerror="this.style.visibility='hidden'">
  <h1>Hasad Agricultural Investments & Development Company</h1>

      <span class="t"><b>E-mail</b><small>info@hasadksa.com</small></span>
      <svg class="go" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
    </a>
    <a class="item" href="https://hasadksa.com/" target="_blank" rel="noopener">
      <span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg></span>
      <span class="t"><b>Website</b><small>https://hasadksa.com/</small></span>
      <svg class="go" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
    </a>
  </div>
  <footer>© Hasad Agricultural Investments & Development Company</footer>
</main>
</body>
</html>
